[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "constrained-xaiops"
version = "0.1.0"
description = "Data-Quality-Aware, Explainable AIOps for Constrained Cloud Environments"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Constrained-xAIOps Core Team" }
]
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0,<2.3.0",
    "pyarrow>=15.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "shap>=0.45.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "psutil>=5.9.8",
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "requests>=2.31.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "configs*", "scripts*", "datasets*"]

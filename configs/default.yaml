# Default configuration for Constrained-xAIOps pipeline
dataset_name: "RE1-OB"
raw_dir: "data/raw/rcaeval"
interim_dir: "data/interim"
processed_dir: "data/processed"
artifacts_dir: "artifacts"

# Timing parameters
pre_fault_buffer_sec: 10
window_size: 60
post_fault_window_sec: 300

# Evaluation & Seeds
seeds:
  - 42
  - 1024
  - 2025
  - 2026
  - 7777

# Microservice System Defaults
system: "OnlineBoutique"
num_services: 10
chance_at_5: 0.50

# Core Algorithmic Hyperparameters
hyperparameters:
  tau_T_conformal: 0.85
  tau_A_incident: 0.35
  lambda_mnar: 3.5
  conformal_coverage: 0.85
  conformal_alpha: 0.15
  stale_freeze_threshold_sec: 60
  imputation_method: "forward_fill"
  knn_neighbors: 5
  robust_zscore_threshold: 3.0
  isolation_forest_contamination: 0.05
  bocpd_hazard_lambda: 100.0

# Paper Publication & Manuscript Metadata
paper:
  title: "Constrained-xAIOps: Data-Quality-Aware, Explainable AIOps for Anomaly Detection and Root-Cause Analysis in Constrained Cloud Environments"

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-audit:
    name: Scientific Integrity & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit Secrets and Environment Hygiene
        run: python scripts/check_no_secrets.py

      - name: Audit Zero-Hardcoding and Dynamic Provenance
        run: python scripts/audit_no_hardcoding.py

      - name: Verify Paper Evidence and Provenance
        run: python scripts/verify_paper_provenance.py

      - name: Audit Citations and Claims
        run: python scripts/audit_citations_and_claims.py

      - name: Audit Plagiarism and Humanization
        run: python scripts/audit_plagiarism_and_humanize.py

      - name: Run Pytest Suite (64 Unit & Regression Tests)
        run: python -m pytest tests/ -v

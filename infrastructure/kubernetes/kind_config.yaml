kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: constrained-xaiops
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 9090
        hostPort: 9090
        protocol: TCP
  - role: worker
  - role: worker
# Cluster resource allocation recommendations:
# Standard Profile: 4 CPUs, 8192 MB RAM
# Lightweight Profile: 2 CPUs, 3584 MB RAM (low-spec edge/laptop testbeds)

apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-checkout
  namespace: boutique
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - boutique
    labelSelectors:
      app: checkoutservice
  delay:
    latency: "250ms"
    jitter: "10ms"
  direction: to
  duration: "120s"
